<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>✂️ Coupeur MP3</title>
<style>
  :root {
    --bg: #1a1a1a;
    --card: #2b2b2b;
    --accent: #4a9eff;
    --green: #22c55e;
    --red: #ef4444;
    --text: #e5e5e5;
    --muted: #888;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 30px 20px;
    font-family: -apple-system, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }
  .container {
    max-width: 900px;
    margin: 0 auto;
  }
  /* ---------- Barre du haut (titre + bouton Aide) ---------- */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    margin: 0 0 30px;
  }
  .header h1 {
    margin: 0;
    font-size: 32px;
    color: #fff;
  }
  .help-btn {
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 10px 18px;
    font-size: 14px;
    border-radius: 8px;
    background: #444;
    color: #fff;
    font-weight: 600;
    cursor: pointer;
    transition: filter 0.2s;
    white-space: nowrap;
  }
  .help-btn:hover { filter: brightness(1.2); }
  /* --------------------------------------------------------- */
  .card {
    background: var(--card);
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 16px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.3);
  }
  .file-row {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }
  .file-name {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    color: var(--muted);
    font-size: 14px;
  }
  .btn {
    background: var(--accent);
    color: white;
    border: none;
    padding: 10px 20px;
    border-radius: 8px;
    font-size: 14px;
    cursor: pointer;
    font-weight: 600;
    transition: all 0.2s;
  }
  .btn:hover:not(:disabled) { filter: brightness(1.15); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn.secondary { background: #444; }
  .btn.big {
    width: 100%;
    padding: 16px;
    font-size: 16px;
    margin-top: 4px;
  }
  .btn.green { background: var(--green); }
  .btn.red   { background: var(--red); }
  #waveform {
    width: 100%;
    height: 140px;
    display: block;
    background: #222;
    border-radius: 8px;
    cursor: crosshair;
  }
  .info {
    text-align: center;
    color: var(--muted);
    font-size: 13px;
    margin-top: 8px;
  }
  .controls-grid {
    display: grid;
    grid-template-columns: auto 1fr auto auto;
    gap: 10px;
    align-items: center;
    margin-top: 16px;
  }
  .controls-grid label {
    font-size: 14px;
    color: var(--muted);
  }
  input[type=text], input[type=number] {
    background: #1a1a1a;
    border: 1px solid #444;
    color: var(--text);
    padding: 8px 10px;
    border-radius: 6px;
    font-size: 14px;
    font-family: 'Consolas', monospace;
    width: 100%;
  }
  input[type=text]:focus, input[type=number]:focus {
    outline: none;
    border-color: var(--accent);
  }
  .fade-row {
    display: flex;
    gap: 20px;
    align-items: center;
    flex-wrap: wrap;
  }
  .fade-row label {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 14px;
    cursor: pointer;
  }
  .fade-row input[type=number] { width: 70px; }
  input[type=checkbox] {
    accent-color: var(--accent);
    width: 16px;
    height: 16px;
    cursor: pointer;
  }
  .status {
    text-align: center;
    padding: 12px;
    color: var(--muted);
    font-size: 14px;
    min-height: 20px;
  }
  .status.ok    { color: var(--green); }
  .status.error { color: var(--red); }
  .hint {
    text-align: center;
    color: var(--muted);
    font-size: 12px;
    margin-top: 6px;
  }
  #progressBar {
    height: 4px;
    background: var(--accent);
    width: 0%;
    border-radius: 2px;
    transition: width 0.2s;
    margin-top: 10px;
  }
</style>
</head>
<body>
<div class="container">

  <!-- ============ BARRE DU HAUT ============ -->
  <div class="header">
    <h1>✂️ Coupeur MP3</h1>
    <a href="AIDE.html" target="_blank" class="help-btn">❓ Aide</a>
  </div>

  <!-- Fichier -->
  <div class="card">
    <div class="file-row">
      <div class="file-name" id="fileName">Aucun fichier sélectionné</div>
      <button class="btn" id="browseBtn">📂 Parcourir</button>
      <input type="file" id="fileInput" accept="audio/*" style="display:none">
    </div>
    <div class="info" id="durationInfo">Durée : --:--</div>
  </div>

  <!-- Forme d'onde -->
  <div class="card">
    <canvas id="waveform" width="860" height="140"></canvas>
    <div class="hint">💡 Cliquez sur la courbe pour placer le curseur, puis utilisez les boutons ci-dessous</div>

    <div class="controls-grid">
      <label>Début :</label>
      <input type="text" id="startTime" value="0">
      <button class="btn secondary" id="setStartHere" style="padding:8px 12px">⬇️ Ici</button>
      <button class="btn green" id="playStart" style="padding:8px 12px">▶</button>

      <label>Fin :</label>
      <input type="text" id="endTime" value="0">
      <button class="btn secondary" id="setEndHere" style="padding:8px 12px">⬇️ Ici</button>
      <button class="btn red" id="playEnd" style="padding:8px 12px">▶</button>
    </div>
  </div>

  <!-- Fondu -->
  <div class="card">
    <div class="fade-row">
      <label><input type="checkbox" id="fadeIn"> 🎚️ Fondu entrée :</label>
      <input type="number" id="fadeInSec" value="0.5" step="0.1" min="0">
      <span style="color:var(--muted)">secondes</span>

      <label style="margin-left:20px"><input type="checkbox" id="fadeOut"> 🎚️ Fondu sortie :</label>
      <input type="number" id="fadeOutSec" value="0.5" step="0.1" min="0">
      <span style="color:var(--muted)">secondes</span>
    </div>
  </div>

  <!-- Bouton couper -->
  <button class="btn big" id="cutBtn" disabled>✂️ Couper et sauvegarder en MP3</button>
  <div id="progressBar"></div>
  <div class="status" id="status">Prêt</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js"></script>
<script>
// ============================================================
//   Coupeur MP3 — Version 100% navigateur
// ============================================================

const $ = id => document.getElementById(id);

let audioBuffer = null;       // AudioBuffer complet
let audioContext = null;
let currentSource = null;     // source en cours de lecture
let currentFileName = "";
let isPlaying = false;
let cursorTime = 0;           // position du clic sur la waveform

// -------- Formatage du temps --------
function formatTime(sec) {
  if (!isFinite(sec)) sec = 0;
  const m = Math.floor(sec / 60);
  const s = sec - m * 60;
  return `${String(m).padStart(2,'0')}:${s.toFixed(2).padStart(5,'0')}`;
}

function parseTime(str) {
  str = String(str).trim();
  if (str === "") return NaN;
  if (str.includes(":")) {
    const p = str.split(":");
    if (p.length === 2) return parseFloat(p[0]) * 60 + parseFloat(p[1]);
    if (p.length === 3) return parseFloat(p[0]) * 3600 + parseFloat(p[1]) * 60 + parseFloat(p[2]);
  }
  return parseFloat(str);
}

function setStatus(msg, type = "") {
  const el = $("status");
  el.textContent = msg;
  el.className = "status " + type;
}

// ============================================================
//   CHARGEMENT DU FICHIER
// ============================================================
$("browseBtn").onclick = () => $("fileInput").click();

$("fileInput").onchange = async (e) => {
  const file = e.target.files[0];
  if (!file) return;

  currentFileName = file.name.replace(/\.[^.]+$/, "");  // sans extension
  $("fileName").textContent = file.name;
  setStatus("Chargement en cours...");

  try {
    const arrayBuffer = await file.arrayBuffer();
    if (!audioContext) audioContext = new (window.AudioContext || window.webkitAudioContext)();
    audioBuffer = await audioContext.decodeAudioData(arrayBuffer.slice(0));
    drawWaveform();
    const dur = audioBuffer.duration;
    $("durationInfo").textContent = `Durée : ${formatTime(dur)}  (${dur.toFixed(2)} s)`;
    $("startTime").value = "0";
    $("endTime").value = formatTime(dur);
    $("cutBtn").disabled = false;
    setStatus("Fichier chargé ✓", "ok");
  } catch (err) {
    console.error(err);
    setStatus("Erreur de chargement : " + err.message, "error");
  }
};

// ============================================================
//   DESSIN DE LA FORME D'ONDE
// ============================================================
function drawWaveform() {
  const canvas = $("waveform");
  const ctx = canvas.getContext("2d");
  const w = canvas.width;
  const h = canvas.height;

  ctx.clearRect(0, 0, w, h);
  ctx.fillStyle = "#222";
  ctx.fillRect(0, 0, w, h);

  if (!audioBuffer) {
    ctx.fillStyle = "#555";
    ctx.font = "14px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("Chargez un fichier audio pour voir sa forme d'onde", w/2, h/2);
    return;
  }

  // Calculer les données d'amplitude
  const data = audioBuffer.getChannelData(0);
  const step = Math.floor(data.length / w);
  const amps = new Float32Array(w);

  let peak = 0;
  for (let i = 0; i < w; i++) {
    let max = 0;
    const start = i * step;
    const end = Math.min(start + step, data.length);
    for (let j = start; j < end; j++) {
      const v = Math.abs(data[j]);
      if (v > max) max = v;
    }
    amps[i] = max;
    if (max > peak) peak = max;
  }
  if (peak > 0) for (let i = 0; i < w; i++) amps[i] /= peak;

  // Grille de fond
  ctx.fillStyle = "#333";
  ctx.fillRect(0, h/2 - 1, w, 2);

  // Sélection
  const dur = audioBuffer.duration;
  let startSec = parseTime($("startTime").value);
  let endSec = parseTime($("endTime").value);
  if (isNaN(startSec)) startSec = 0;
  if (isNaN(endSec)) endSec = dur;
  const selX1 = (startSec / dur) * w;
  const selX2 = (endSec / dur) * w;
  ctx.fillStyle = "rgba(74, 158, 255, 0.18)";
  ctx.fillRect(selX1, 0, selX2 - selX1, h);

  // Forme d'onde
  ctx.fillStyle = "#4a9eff";
  const mid = h / 2;
  for (let i = 0; i < w; i++) {
    const a = amps[i] * mid * 0.92;
    ctx.fillRect(i, mid - a, 1, a * 2);
  }

  // Marqueurs début/fin
  ctx.fillStyle = "#22c55e";
  ctx.fillRect(selX1, 0, 2, h);
  ctx.fillStyle = "#ef4444";
  ctx.fillRect(selX2 - 2, 0, 2, h);

  // Curseur
  if (cursorTime > 0) {
    const cx = (cursorTime / dur) * w;
    ctx.fillStyle = "#facc15";
    ctx.fillRect(cx, 0, 1, h);
  }
}

// Clic sur la waveform → place le curseur
$("waveform").addEventListener("click", (e) => {
  if (!audioBuffer) return;
  const rect = e.target.getBoundingClientRect();
  const x = e.clientX - rect.left;
  const ratio = x / rect.width;
  cursorTime = ratio * audioBuffer.duration;
  drawWaveform();
});

// Boutons "⬇️ Ici"
$("setStartHere").onclick = () => {
  if (!audioBuffer) return;
  $("startTime").value = formatTime(cursorTime);
  drawWaveform();
};
$("setEndHere").onclick = () => {
  if (!audioBuffer) return;
  $("endTime").value = formatTime(cursorTime);
  drawWaveform();
};

// Mise à jour du dessin quand on tape dans les champs
$("startTime").oninput = drawWaveform;
$("endTime").oninput = drawWaveform;

// ============================================================
//   LECTURE (prévisualisation)
// ============================================================
function stopPlayback() {
  if (currentSource) {
    try { currentSource.stop(); } catch(e) {}
    currentSource = null;
  }
}

function playSegment(startSec, endSec) {
  if (!audioBuffer) return;
  stopPlayback();
  if (!audioContext) audioContext = new (window.AudioContext || window.webkitAudioContext)();
  if (audioContext.state === "suspended") audioContext.resume();

  const src = audioContext.createBufferSource();
  src.buffer = audioBuffer;
  src.connect(audioContext.destination);
  src.start(0, Math.max(0, startSec), Math.max(0, endSec - startSec));
  currentSource = src;
}

$("playStart").onclick = () => {
  if (!audioBuffer) return;
  const s = parseTime($("startTime").value);
  if (isNaN(s)) { setStatus("Début invalide", "error"); return; }
  playSegment(s, Math.min(s + 5, audioBuffer.duration));
  setStatus(`▶ Lecture depuis ${formatTime(s)}`);
};

$("playEnd").onclick = () => {
  if (!audioBuffer) return;
  const e = parseTime($("endTime").value);
  if (isNaN(e)) { setStatus("Fin invalide", "error"); return; }
  playSegment(Math.max(0, e - 5), e);
  setStatus(`▶ Lecture jusqu'à ${formatTime(e)}`);
};

// ============================================================
//   ENCODAGE MP3 (lamejs)
// ============================================================
function floatToInt16(floatArray) {
  const out = new Int16Array(floatArray.length);
  for (let i = 0; i < floatArray.length; i++) {
    let v = floatArray[i];
    if (v > 1) v = 1;
    if (v < -1) v = -1;
    out[i] = v < 0 ? v * 0x8000 : v * 0x7FFF;
  }
  return out;
}

function encodeMP3(buffer, kbps = 192) {
  const channels = Math.min(buffer.numberOfChannels, 2);
  const sampleRate = buffer.sampleRate;
  const encoder = new lamejs.Mp3Encoder(channels, sampleRate, kbps);

  const left = floatToInt16(buffer.getChannelData(0));
  const right = channels > 1 ? floatToInt16(buffer.getChannelData(1)) : null;

  const blockSize = 1152;
  const chunks = [];
  const total = left.length;

  for (let i = 0; i < total; i += blockSize) {
    const l = left.subarray(i, i + blockSize);
    let buf;
    if (right) {
      const r = right.subarray(i, i + blockSize);
      buf = encoder.encodeBuffer(l, r);
    } else {
      buf = encoder.encodeBuffer(l);
    }
    if (buf.length > 0) chunks.push(new Int8Array(buf));
  }
  const last = encoder.flush();
  if (last.length > 0) chunks.push(new Int8Array(last));

  return new Blob(chunks, { type: "audio/mpeg" });
}

// ============================================================
//   DÉCOUPE
// ============================================================
$("cutBtn").onclick = async () => {
  if (!audioBuffer) return;

  const startSec = parseTime($("startTime").value);
  const endSec   = parseTime($("endTime").value);

  if (isNaN(startSec) || isNaN(endSec)) {
    setStatus("Format de temps invalide", "error"); return;
  }
  if (startSec < 0 || endSec > audioBuffer.duration) {
    setStatus("Les temps doivent être dans la durée du fichier", "error"); return;
  }
  if (startSec >= endSec) {
    setStatus("Le début doit être avant la fin", "error"); return;
  }

  const fadeInOn = $("fadeIn").checked;
  const fadeOutOn = $("fadeOut").checked;
  const fadeInSec = fadeInOn ? parseFloat($("fadeInSec").value) || 0 : 0;
  const fadeOutSec = fadeOutOn ? parseFloat($("fadeOutSec").value) || 0 : 0;

  const segDur = endSec - startSec;
  if (fadeInSec + fadeOutSec > segDur) {
    setStatus("La somme des fondus dépasse la durée de l'extrait", "error"); return;
  }

  $("cutBtn").disabled = true;
  setStatus("Découpage en cours...");
  $("progressBar").style.width = "30%";

  // Découper le buffer
  const sampleRate = audioBuffer.sampleRate;
  const startSample = Math.floor(startSec * sampleRate);
  const endSample = Math.floor(endSec * sampleRate);
  const length = endSample - startSample;

  const newBuffer = audioContext.createBuffer(
    audioBuffer.numberOfChannels, length, sampleRate
  );

  for (let ch = 0; ch < audioBuffer.numberOfChannels; ch++) {
    const src = audioBuffer.getChannelData(ch);
    const dst = newBuffer.getChannelData(ch);
    for (let i = 0; i < length; i++) {
      dst[i] = src[startSample + i];
    }
  }

  // Appliquer les fondus
  const fadeInSamples = Math.floor(fadeInSec * sampleRate);
  const fadeOutSamples = Math.floor(fadeOutSec * sampleRate);

  if (fadeInSamples > 0) {
    for (let ch = 0; ch < newBuffer.numberOfChannels; ch++) {
      const d = newBuffer.getChannelData(ch);
      for (let i = 0; i < fadeInSamples; i++) d[i] *= i / fadeInSamples;
    }
  }
  if (fadeOutSamples > 0) {
    for (let ch = 0; ch < newBuffer.numberOfChannels; ch++) {
      const d = newBuffer.getChannelData(ch);
      const start = length - fadeOutSamples;
      for (let i = 0; i < fadeOutSamples; i++) {
        d[start + i] *= 1 - i / fadeOutSamples;
      }
    }
  }

  $("progressBar").style.width = "60%";

  // Encoder en MP3 (laisser le temps à l'UI de respirer)
  setTimeout(() => {
    try {
      const blob = encodeMP3(newBuffer, 192);
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `${currentFileName}_cut.mp3`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 5000);

      $("progressBar").style.width = "100%";
      setStatus(`✓ Fichier sauvegardé : ${currentFileName}_cut.mp3`, "ok");
      setTimeout(() => { $("progressBar").style.width = "0%"; }, 1500);
    } catch (err) {
      console.error(err);
      setStatus("Erreur d'encodage : " + err.message, "error");
      $("progressBar").style.width = "0%";
    }
    $("cutBtn").disabled = false;
  }, 50);
};

// ============================================================
//   RACCOURCIS CLAVIER
// ============================================================
document.addEventListener("keydown", (e) => {
  // Ctrl+O
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "o") {
    e.preventDefault();
    $("fileInput").click();
  }
  // Échap = arrêter le son
  if (e.key === "Escape") {
    stopPlayback();
    setStatus("⏹ Lecture arrêtée");
  }
});

// Init
drawWaveform();
</script>
</body>
</html>
